name: Project integrity
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_project.py
      - run: PYTHONPATH=src python -c 'import activi_agent; print(activi_agent.__version__)'
